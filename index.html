<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>myLib – Meine Bücher</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>📚 myLib</h1>
    <p id="stats"></p>
  </header>

  <main>
    <form id="book-form" autocomplete="off">
      <input type="hidden" id="book-id">
      <div class="row">
        <input id="isbn" placeholder="ISBN" inputmode="numeric">
        <button type="button" id="lookup-btn">ISBN suchen</button>
      </div>
      <p id="lookup-status" class="hint" hidden></p>
      <div class="row">
        <input id="title" placeholder="Titel" required>
        <input id="author" placeholder="Autor">
      </div>
      <div class="row" id="edit-fields" hidden>
        <label><input type="checkbox" id="owned"> Besitze ich</label>
        <label><input type="checkbox" id="read"> Gelesen am</label>
        <input type="date" id="read-at">
      </div>
      <div class="row">
        <button type="submit" id="submit-btn">Auf Wunschliste setzen</button>
        <button type="button" id="cancel-btn" hidden>Abbrechen</button>
      </div>
    </form>

    <div class="toolbar">
      <input id="search" type="search" placeholder="Suchen nach Titel, Autor oder ISBN …">
      <select id="filter">
        <option value="all">Alle</option>
        <option value="wishlist">Wunschliste</option>
        <option value="unread-owned">Besitze, ungelesen</option>
        <option value="read">Gelesen</option>
      </select>
    </div>

    <ul id="book-list"></ul>
    <p id="empty" hidden>Keine Bücher gefunden.</p>

    <footer>
      <button type="button" id="export-btn">Exportieren</button>
      <label class="import">Importieren<input type="file" id="import-file" accept="application/json" hidden></label>
    </footer>
  </main>

  <script src="app.js"></script>
</body>
</html>
